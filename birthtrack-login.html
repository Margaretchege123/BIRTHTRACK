<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BirthTrack System - Login</title>
<link rel="stylesheet" href="birthtrack-style.css" />
</head>
<body>
<div class="login-wrapper">
  <form class="login-panel" id="loginForm">
    <h1 id="loginTitle">birthtrack system</h1>
    <p class="subtitle">birthtrack centre, kisii</p>
    <div class="field-group" id="nameGroup">
      <label class="field-label" for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" autocomplete="name" maxlength="120" />
    </div>
    <div class="field-group">
      <label class="field-label" for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9._-]+" required />
    </div>
    <div class="field-group">
      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" minlength="6" required />
    </div>
    <button type="submit" class="btn btn-primary sign-in-btn" id="submitButton">Continue</button>
    <p class="login-error" id="loginError" role="alert"></p>
    <p id="accountSwitch"></p>
  </form>
</div>
<script src="birthtrack-script.js"></script>
</body>
</html>
